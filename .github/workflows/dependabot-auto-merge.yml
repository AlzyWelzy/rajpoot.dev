name: Dependabot auto-merge

# Queues routine Dependabot updates for merge once every required check passes.
# Auto-merge is a queue, not an immediate merge: if CI or the Cloudflare
# deploy fails, the PR just sits there. Majors are deliberately excluded --
# they get read by hand.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # For a grouped PR this reports the largest semver bump in the group, so a
      # single major anywhere in the group keeps the whole PR manual.
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
