name: Generate visual baseline snapshots (throwaway)

on:
  # workflow_dispatch only becomes dispatchable once a workflow file exists
  # on the default branch, which this deliberately never will — trigger via
  # push instead so it runs immediately on this branch.
  push:
    branches: [rewrite/astro-cloudflare]
    paths: [.github/workflows/gen-snapshots.yml]

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate snapshots
        run: |
          rm -rf e2e/visual.spec.ts-snapshots
          CI=1 pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
        env:
          PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000BB"

      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 1
