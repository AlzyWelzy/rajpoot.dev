name: Deploy to Cloudflare

# Auto-deploys rajpoot.me on every push to this branch — this is the interim
# testing domain while the Cloudflare migration and further work (Turnstile,
# framework evaluation) continue here, before main/rajpoot.dev's cutover.
# Deliberately independent of the main CI workflow's lint/test/e2e/lighthouse
# checks (those still run via ci.yml's pull_request trigger on the open PR)
# so a push shows up on the live site quickly rather than waiting on the
# full suite — acceptable while this is a testing domain, not the production
# cutover target.

on:
  push:
    branches: [rewrite/deploy-to-cloudflare]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        env:
          # Build-time only (Next inlines NEXT_PUBLIC_* into the static
          # output) — none of these are sensitive. Runtime secrets
          # (TURNSTILE_SECRET, RESEND_API_KEY, ...) live on the Worker
          # itself via `wrangler secret put` and don't need to be re-set on
          # every deploy.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Belt-and-suspenders: most routes already answer with cache-control
      # headers that keep Cloudflare's edge cache short-lived, but purging
      # on every deploy guarantees visitors see the new build immediately
      # rather than a stale cached response from before this push.
      - name: Purge Cloudflare cache
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -d '{"purge_everything":true}' \
            | tee /tmp/purge-response.json \
            | grep -q '"success":true'
