name: Deploy to Cloudflare

# Auto-deploys the Astro rewrite to its own Worker (rajpoot-astro-portfolio)
# on every push to this branch. Deliberately a *different* Worker script
# from the live rajpoot-dev-portfolio (Next.js) — nothing here is bound to
# a real Custom Domain yet, so this is safe to auto-deploy on every push
# while the rewrite is being verified. The rajpoot.me cutover (rebinding the
# Custom Domain to this script) happens manually, once, after that
# verification — not as part of this workflow.
#
# Deliberately independent of the main CI workflow's lint/test/e2e/lighthouse
# checks (those still run via ci.yml's pull_request trigger on the open PR)
# so a push shows up on the *.workers.dev preview quickly rather than
# waiting on the full suite.

on:
  push:
    branches: [rewrite/astro-cloudflare]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        env:
          # Build-time only (Vite inlines PUBLIC_* into the static output) —
          # none of these are sensitive. Runtime secrets (TURNSTILE_SECRET,
          # RESEND_API_KEY, ...) live on the Worker itself via
          # `wrangler secret put` and don't need to be re-set on every deploy.
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
