name: Deploy to Cloudflare

# Auto-deploys to the rajpoot-astro-portfolio Worker on every push to the
# listed branches.
#
# THIS IS PRODUCTION. The rajpoot.me Custom Domain has been rebound to this
# Worker, so a push here goes straight to the live site — it is no longer a
# *.workers.dev preview. (The retired Next.js Worker, rajpoot-dev-portfolio,
# is still deployed but unbound, as a rollback option.)
#
# For rewrite/beyond-astro-cloudflare this workflow no longer runs at all —
# see the trigger note below.

# No automatic trigger. Auto-deploy for rewrite/beyond-astro-cloudflare now
# lives in ci.yml's `deploy` job, gated behind build/verify/e2e/lighthouse.
# This file is kept only as a manual escape hatch: to force a deploy without
# CI (a rollback, or shipping while a flaky job is being fixed), temporarily
# re-add a `push` trigger for your branch, or run `pnpm deploy` locally with
# CLOUDFLARE_API_TOKEN set.
#
# `workflow_dispatch` is intentionally absent: GitHub only exposes it for
# workflow files present on the default branch, and this one is not.
on:
  push:
    branches: [rewrite/astro-cloudflare]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        env:
          # Build-time only (Vite inlines PUBLIC_* into the static output) —
          # none of these are sensitive. Runtime secrets (TURNSTILE_SECRET,
          # RESEND_API_KEY, ...) live on the Worker itself via
          # `wrangler secret put` and don't need to be re-set on every deploy.
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
