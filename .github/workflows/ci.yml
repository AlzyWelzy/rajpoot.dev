name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal default token scope; only what the jobs actually need.
permissions:
  contents: read

# Supersede in-progress runs for the same branch/PR so pushes don't queue
# heavy jobs against stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build used to run once and be shared as an artifact, because a Next
  # production build took minutes. `vite build` takes about seven seconds, so
  # each job now builds for itself — which removes the artifact plumbing and,
  # more importantly, lets the E2E job build with E2E_TESTING=1. That flag
  # changes the generated `_headers` (it omits `upgrade-insecure-requests`,
  # which WebKit applies to localhost and which would break every asset load
  # under Playwright), so an E2E build and a production build are no longer the
  # same artifact. src/lib/security-headers.test.ts covers the production form.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      # Browsers restored from cache still need the OS packages.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      # playwright.config.ts's webServer builds with E2E_TESTING=1 and then
      # serves the result through `wrangler dev` — the same workerd runtime and
      # static-asset pipeline Cloudflare runs in production, which is what makes
      # the `_headers` assertions meaningful.
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # A real production build — no E2E_TESTING — so Lighthouse scores exactly
      # what ships.
      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI (desktop)
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Run Lighthouse CI (mobile)
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
