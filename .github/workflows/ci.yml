name: CI

on:
  push:
    branches: [main, rewrite/astro-cloudflare, rewrite/beyond-astro-cloudflare]
  pull_request:

# Minimal default token scope; only what the jobs actually need.
permissions:
  contents: read

# Supersede in-progress runs for the same branch/PR so pushes don't queue
# heavy jobs against stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build happens exactly once and is shared with the jobs that need a
  # running server. Built with Cloudflare's public always-pass Turnstile
  # testing sitekey (see playwright.config.ts) baked in — this artifact is
  # CI-only and is never the one deployed, so it must not be treated as a
  # release candidate.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000BB"
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astro-build
          # .wrangler/deploy/config.json is the pointer wrangler's "redirected
          # configuration" detection reads to find dist/server/wrangler.json —
          # without it, `wrangler dev` falls back to the root wrangler.jsonc's
          # literal (unresolvable) `main` field. Astro/the adapter write it as
          # a side effect of `astro build`, outside dist/, so it has to be
          # captured and restored alongside dist explicitly.
          path: |
            dist
            .wrangler/deploy
          include-hidden-files: true
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Generate Cloudflare runtime types
        # worker-configuration.d.ts (the `cloudflare:workers` module + `Env`
        # interface declarations) is gitignored and regenerated on demand —
        # `astro check` needs it on disk first. `wrangler types` infers the
        # Env interface's shape from the *names* present in .dev.vars (a
        # gitignored, developer-local file), not from real values — so a
        # fresh CI checkout needs a stand-in with the same key names.
        run: |
          cp .env.example .dev.vars
          pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astro-build
          # Restores to the repo root, not dist/ — the artifact already
          # contains dist/... and .wrangler/deploy/... as relative paths
          # (see the build job's upload step).
          path: .

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      # Browsers restored from cache still need the OS packages.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Run E2E tests
        env:
          E2E_SKIP_BUILD: "1"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astro-build
          # Restores to the repo root, not dist/ — the artifact already
          # contains dist/... and .wrangler/deploy/... as relative paths
          # (see the build job's upload step).
          path: .

      - name: Run Lighthouse CI (desktop)
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Run Lighthouse CI (mobile)
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json

  # Deploying to rajpoot.me lives here, as a gated job, rather than in its own
  # workflow. The obvious alternative — a separate workflow triggered by
  # `workflow_run: [CI]` — cannot work on this repo: GitHub only fires
  # `workflow_run` from the *default branch's* copy of the workflow file, and
  # the Astro rewrite is deliberately not on `main`. A `needs:` edge inside
  # the workflow that is already running on this branch is the only way to
  # make green checks a precondition for shipping.
  #
  # THIS IS PRODUCTION. The rajpoot.me Custom Domain is bound to the
  # rajpoot-astro-portfolio Worker. (The retired Next.js Worker,
  # rajpoot-dev-portfolio, is still deployed but unbound, as a rollback.)
  deploy:
    needs: [build, verify, e2e, lighthouse]
    # `push` only: a pull_request run must never deploy, and neither must a
    # push to any other branch. Both conditions are required — `needs` alone
    # would happily deploy a green PR.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/rewrite/beyond-astro-cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Deliberately a fresh build, not the `build` job's artifact: that one
      # is baked with Cloudflare's always-pass Turnstile *testing* sitekey so
      # the e2e suite can drive the form. Deploying it would leave the live
      # contact form accepting anything.
      - name: Build
        env:
          # Build-time only (Vite inlines PUBLIC_* into the static output) —
          # none of these are sensitive. Runtime secrets (TURNSTILE_SECRET,
          # RESEND_API_KEY, ...) live on the Worker itself via
          # `wrangler secret put` and don't need re-setting on every deploy.
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
