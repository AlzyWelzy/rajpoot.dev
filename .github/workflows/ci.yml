name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal default token scope; only what the jobs actually need.
permissions:
  contents: read

# Supersede in-progress runs for the same branch/PR so pushes don't queue
# heavy jobs against stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The production build happens exactly once and is shared with the jobs that
  # need a running server. It used to run three times (here, inside Playwright's
  # webServer, and again for Lighthouse); the CSP no longer differs between an
  # E2E build and a real one, so one artifact is valid for all of them.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync-build-meta derives the content date from history; a depth-1
          # clone would usually miss the last commit that touched content.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        env:
          # Cloudflare's publicly documented always-pass testing sitekey —
          # not a secret. Needed at build time (Next inlines NEXT_PUBLIC_*
          # values) so this shared artifact's contact form has a working
          # Turnstile widget for the e2e job (which reuses this build via
          # E2E_SKIP_BUILD=1) and the lighthouse job. Matches
          # TURNSTILE_TEST_SITE_KEY in playwright.config.ts — keep both in
          # sync. https://developers.cloudflare.com/turnstile/troubleshooting/testing/
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000BB"
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      # Browsers restored from cache still need the OS packages.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Run E2E tests
        env:
          E2E_SKIP_BUILD: "1"
          # Matches TURNSTILE_TEST_SECRET in playwright.config.ts — the
          # counterpart to the sitekey baked into this build in the `build`
          # job above. Also not a secret, see the comment there.
          TURNSTILE_SECRET: "1x0000000000000000000000000000000AA"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next

      - name: Run Lighthouse CI (desktop)
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      - name: Run Lighthouse CI (mobile)
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
