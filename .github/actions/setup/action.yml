name: Setup pnpm and install
description: >
  Set up pnpm + Node (with store caching), recreate the gitignored
  pnpm-workspace.yaml build-script approvals, and install dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    # Build approvals + overrides now live in the committed pnpm-workspace.yaml
    # (single source for CI, local, and Vercel), so no recreation step is needed.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
