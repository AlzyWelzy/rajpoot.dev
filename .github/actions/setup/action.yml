name: Setup pnpm and install
description: >
  Set up pnpm + Node (with store caching), recreate the gitignored
  pnpm-workspace.yaml build-script approvals, and install dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    # Build approvals + overrides now live in the committed pnpm-workspace.yaml
    # (single source for CI, local, and the Cloudflare deploy), so no
    # recreation step is needed.
    - name: Install dependencies
      shell: bash
      env:
        IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
      run: |
        if pnpm install --frozen-lockfile; then
          exit 0
        fi
        # Dependabot strips the pnpm-workspace.yaml `overrides:` block from the
        # lockfile, so the frozen install aborts. dependabot-lockfile.yml pushes
        # a repaired lockfile, but this run can start before that lands -- so on
        # Dependabot branches, repair in place rather than reporting a red check
        # for a problem that is already being fixed. Everywhere else a lockfile
        # mismatch stays fatal.
        if [ "$IS_DEPENDABOT" != 'true' ]; then
          exit 1
        fi
        echo "::warning::Lockfile out of sync on a Dependabot branch; regenerating for this run."
        pnpm install --no-frozen-lockfile
