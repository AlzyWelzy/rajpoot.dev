name: Setup pnpm and install
description: >
  Set up pnpm + Node (with store caching), recreate the gitignored
  pnpm-workspace.yaml build-script approvals, and install dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm

    # pnpm-workspace.yaml is gitignored (Vercel's pnpm 9 rejects a
    # settings-only workspace file), so recreate before installing:
    #  - build-script approvals pnpm 11 requires, and
    #  - overrides forcing next's vulnerable nested sharp (<0.35.0) and
    #    postcss (<=8.5.17) up to patched versions. These must match the
    #    lockfile's `overrides:` block or `--frozen-lockfile` fails. pnpm 11
    #    ignores package.json `pnpm.overrides`, so they must live here.
    - name: Recreate pnpm-workspace.yaml (build approvals + overrides)
      shell: bash
      run: |
        cat > pnpm-workspace.yaml <<'EOF'
        allowBuilds:
          esbuild: true
          sharp: true
          unrs-resolver: true
        minimumReleaseAgeExclude:
          - postcss@8.5.23
        overrides:
          sharp: ^0.35.3
          postcss: ^8.5.23
        EOF

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
