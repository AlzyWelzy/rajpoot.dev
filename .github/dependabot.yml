# Weekly dependency updates. npm minor/patch bumps arrive as one grouped PR to
# keep noise down; majors and GitHub Actions (SHA-pinned in ci.yml) come
# individually.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Held-back majors. These are known-incompatible with the current Next
    # toolchain, so without these rules Dependabot reopens the same PR every
    # week and it has to be closed by hand every time. Drop an entry once the
    # ceiling actually lifts.
    ignore:
      # TypeScript 7 (the native port) is not yet supported by
      # eslint-config-next / the Next TS plugin.
      - dependency-name: "typescript"
        versions: [">=7"]
      # ESLint 10 removes APIs eslint-config-next still relies on.
      - dependency-name: "eslint"
        versions: [">=10"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
