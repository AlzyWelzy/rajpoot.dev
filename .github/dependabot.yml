# Daily dependency updates, batched into two npm PRs: one for minor/patch and
# one for majors. Majors stay in their own PR because dependabot-auto-merge.yml
# only queues non-major updates -- mixing them would block routine bumps behind
# a manual review.
#
# Note: every npm PR here lands with a lockfile missing the pnpm-workspace.yaml
# `overrides:` block; dependabot-lockfile.yml repairs it. See that workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    # Held-back majors. Without these rules Dependabot reopens the same PR
    # every day and it has to be closed by hand every time. Drop an entry once
    # the ceiling actually lifts.
    #
    # The ESLint 10 hold is gone: it existed for eslint-config-next, which the
    # move to SvelteKit removed.
    ignore:
      # TypeScript 7 (the native port) is not yet supported by svelte-check or
      # typescript-eslint.
      - dependency-name: "typescript"
        versions: [">=7"]

  # SHA-pinned in the workflows; grouped so an Actions sweep is one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns: ["*"]
