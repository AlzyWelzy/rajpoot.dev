# pnpm 10/11 configuration (committed — read by CI and local installs alike).
# pnpm no longer reads the `pnpm` field in package.json, so overrides must live
# here or `--frozen-lockfile` fails against the lockfile's recorded overrides.
#
# allowBuilds: native postinstall scripts pnpm 11 requires explicit approval
# for. `workerd` is the Cloudflare Workers runtime behind `wrangler dev` and the
# adapter's platformProxy — without its postinstall there is no local Worker to
# run against.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  sharp: ^0.35.3
