# pnpm 10/11 configuration (committed — read by CI, local, and Vercel via
# corepack + the packageManager field). pnpm no longer reads the `pnpm` field
# in package.json, so overrides must live here or `--frozen-lockfile` fails
# against the lockfile's recorded overrides.
#
# overrides: force next's vulnerable nested sharp (<0.35.0) and postcss
# (<=8.5.17) up to patched versions so `pnpm audit --prod` stays clean.
# allowBuilds: native postinstall scripts pnpm 11 requires explicit approval for.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.23
# publicHoistPattern: next copies each `serverExternalPackages` entry into
# .next/node_modules/<name>-<hash>/ WITHOUT its transitive deps, so at runtime
# `resend` resolves its own imports by walking up to the project's
# node_modules. pnpm's strict linker doesn't put them there, so `next start`
# dies with ERR_MODULE_NOT_FOUND on postal-mime. Hoisting resend's runtime deps
# to the root makes that walk-up succeed. Versions still come from the lockfile
# (resend pins them exactly), so this is placement only, not a version choice.
publicHoistPattern:
  - postal-mime
  - standardwebhooks
overrides:
  sharp: ^0.35.3
  postcss: ^8.5.23
