# pnpm 10/11 configuration (committed — read by CI, local, and Cloudflare via
# corepack + the packageManager field). pnpm no longer reads the `pnpm` field
# in package.json, so overrides must live here or `--frozen-lockfile` fails
# against the lockfile's recorded overrides.
#
# allowBuilds: native postinstall scripts pnpm 11 requires explicit approval
# for. workerd (wrangler/miniflare's local runtime) and esbuild are needed by
# the toolchain; postcss/nanoid overrides below are Vite/Tailwind transitive
# deps, not framework-specific — kept patched for `pnpm audit`.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - eslint-plugin-svelte@3.23.0
  - miniflare@5.20260811.1-alpha
  - svelte@5.56.9
  - wrangler@4.123.0
overrides:
  postcss: ^8.5.23
  nanoid: ^3.3.17
