<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Applies the stored (or OS) theme before first paint, so a dark-mode
      // visitor never sees a white flash. Must stay inline and stay in <head>:
      // an external file would be a round trip, and anywhere later would paint
      // the wrong theme first.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    class="relative bg-gray-50 pt-28 text-gray-950 sm:pt-36 dark:bg-gray-900 dark:text-gray-50/90"
  >
    <div
      aria-hidden="true"
      class="theme-surface absolute -top-24 right-44 -z-10 h-125 w-125 rounded-full bg-[#fbe2e3] blur-3xl sm:w-275 dark:bg-[#946263]"
    ></div>
    <div
      aria-hidden="true"
      class="theme-surface absolute -top-4 -left-140 -z-10 h-125 w-200 rounded-full bg-[#dbd7fb] blur-3xl sm:w-275 md:-left-132 lg:-left-112 xl:-left-60 2xl:-left-20 dark:bg-[#676394]"
    ></div>
    %sveltekit.body%
  </body>
</html>
